# ============================================================
#  Clash 配置 · Jason3u（由 Quantumult X qx-public.conf 逐条转换）
#  适用于 PC（Clash Verge Rev / Mihomo Party）与 Android（ClashMetaForAndroid）
#  需要 Meta 内核（mihomo）：订阅为 VLESS 节点，原版 Clash 内核不支持
#
#  分流总览（与 QX 完全一致）：
#    Apple 核心（AppStore/iCloud 等）  → DIRECT 直连
#    Apple 外区（AppleTV/AppleNews）   → 兜底分流
#    AI（GPT/Gemini/Claude/Grok）      → 各自独立策略组
#    X（Twitter）                      → X（默认香港节点）
#    Binance 币安                      → Binance（默认国内直连，可手动切友好地区）
#    其他交易所（OKX/Bybit/Bitget/Gate）→ 各自独立策略组（默认香港住宅IP）
#    Cornix 自动交易                  → Cornix（固定新加坡地区，区内自动最低延迟）
#    国内网站                          → DIRECT 直连
#    其余外网（含流媒体）              → 兜底分流
#
#  说明：QX 的去广告/MitM 重写脚本 Clash 无法使用，未迁移
# ============================================================

# 端口
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: false        # 如需局域网共享代理，改为 true
mode: rule
log-level: info
ipv6: false             # 对应 QX [dns] no-ipv6
external-controller: 127.0.0.1:9090

# DNS（对应 QX [dns]）
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 机场订阅（对应 QX [server_remote] 良心云）
proxy-providers:
  良心云:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 1200
    url: https://liangxin.xyz/api/v1/liangxin?OwO=08473de9c81c32890fb3c8744ba74b5b
    path: ./proxy_providers/liangxin.yaml

# 对应 QX [server_local] 留空
proxies: null

# ============================================================
#  策略组
# ============================================================
proxy-groups:
  # ---------- 节点池（url-test 自动测速，对应 QX url-latency-benchmark，check-interval=1200, tolerance=0） ----------
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
  - name: 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "美国|美|US|(?i)States|American"
  - name: 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "日本|JP|(?i)Japan|东京|大阪"
  - name: 新加坡节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "新加坡|狮城|SG|(?i)Singapore"
  - name: 英国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "英国|英|UK|(?i)Britain|London"
  - name: 韩国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "韩国|韩|KR|(?i)Korea|首尔"
  - name: 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "台湾|TW|(?i)Taiwan|台北"
  - name: 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "香港|港|HK|(?i)Hong"
  - name: 香港住宅IP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 0
    use: [良心云]
    filter: "住宅"

  # ---------- 手动切换（对应 QX static 组内 proxy 选项：手动指定单个节点） ----------
  - name: 手动切换
    type: select
    use: [良心云]

  # ---------- 兜底分流：未命中规则的外网流量（含流媒体）最终出口 ----------
  - name: 兜底分流
    type: select
    proxies:
      - 自动选择
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
      - 香港节点
      - DIRECT
      - 手动切换

  # ---------- AI：每个服务独立策略组（手动选地区，规避 IP 跳变风控） ----------
  - name: OpenAI
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Gemini
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Claude
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Grok
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点

  # ---------- X：默认香港节点（规避风控） ----------
  - name: X
    type: select
    proxies:
      - 香港节点

  # ---------- Binance 币安：默认国内直连，可手动切友好地区（按友好排名） ----------
  - name: Binance
    type: select
    proxies:
      - DIRECT
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- OKX 欧易：默认香港住宅IP（规避风控） ----------
  - name: OKX
    type: select
    proxies:
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Bybit：默认香港住宅IP（官方禁止大陆，需代理） ----------
  - name: Bybit
    type: select
    proxies:
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Bitget：默认香港住宅IP（官方禁止大陆，需代理） ----------
  - name: Bitget
    type: select
    proxies:
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Gate：默认香港住宅IP（官方禁止大陆，需代理） ----------
  - name: Gate
    type: select
    proxies:
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Cornix：固定新加坡地区，节点由新加坡节点测速组自动选择最低延迟 ----------
  - name: Cornix
    type: select
    proxies:
      - 新加坡节点

# ============================================================
