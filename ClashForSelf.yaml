# 修改本配置前，必须先查看同仓库的 CHANGELOG.md（修改日志），
# 了解历次改动与当前策略组状态；每次修改完成后必须在 CHANGELOG.md 追加记录。
# ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

# ============================================================
#  Clash 配置 · Jason3u（由 Quantumult X qx-public.conf 逐条转换）
#  适用于 PC（Clash Verge Rev / Mihomo Party）与 Android（ClashMetaForAndroid）
#  需要 Meta 内核（mihomo）：订阅为 VLESS 节点，原版 Clash 内核不支持
#
#  分流总览（与 QX 完全一致）：
#    Apple 核心（AppStore/iCloud 等）  → DIRECT 直连
#    Apple 外区（AppleNews）           → 兜底分流
#    AppleTV                           → InternationalStreaming
#    AI（GPT/Gemini/Claude/Grok）      → 各自独立策略组
#    Telegram 消息                     → Telegram（默认香港节点；App 直连 DC IP，已配 IP 段规则）
#    X（Twitter）                      → X（默认香港自动，住宅优先，无住宅回退香港节点）
#    Binance 币安                      → Binance（默认香港自动：主域直连已被墙，可手动切 DIRECT/友好地区）
#    其他交易所（OKX/Bybit/Bitget/Gate）→ 各自独立策略组（默认香港自动：住宅/香港节点自动选可用）
#    TradingView 行情图表            → TradingView（默认香港自动，可手动切地区）
#    Cornix 自动交易                  → Cornix（默认香港节点，可手动切新加坡/日本）
#    Fomo                            → Fomo（默认 DIRECT 直连，可手动切换地区节点）
#    国际流媒体（Netflix/Disney+/HBO/YouTube/Spotify/TikTok 等）→ InternationalStreaming
#    国内网站                          → DIRECT 直连
#    其余外网                          → 兜底分流
#
#  说明：QX 的去广告/MitM 重写脚本 Clash 无法使用，未迁移
# ============================================================

# 端口
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: false        # 如需局域网共享代理，改为 true
mode: rule
log-level: info
ipv6: false             # 对应 QX [dns] no-ipv6
external-controller: 127.0.0.1:9090

# DNS（对应 QX [dns]）
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 机场订阅（对应 QX [server_remote] 良心云）
proxy-providers:
  良心云:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 1200
    url: https://liangxin.xyz/api/v1/liangxin?OwO=08473de9c81c32890fb3c8744ba74b5b
    path: ./proxy_providers/liangxin.yaml

# 对应 QX [server_local] 留空
proxies: null

# ============================================================
#  策略组
# ============================================================
proxy-groups:
  # ---------- 节点池（url-test 自动测速，对应 QX url-latency-benchmark，check-interval=1200, tolerance=100） ----------
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
  - name: 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "美国|美|US|(?i)States|American"
  - name: 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "日本|JP|(?i)Japan|东京|大阪"
  - name: 新加坡节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "新加坡|狮城|SG|(?i)Singapore"
  - name: 英国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "英国|英|UK|(?i)Britain|London"
  - name: 韩国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "韩国|韩|KR|(?i)Korea|首尔"
  - name: 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "台湾|TW|(?i)Taiwan|台北"
  - name: 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "香港|港|HK|(?i)Hong"
  - name: 香港住宅IP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 100
    use: [良心云]
    filter: "住宅"

  # ---------- 香港自动：住宅优先，无住宅时自动回退香港节点（对应 QX available；Clash fallback 支持嵌套组） ----------
  - name: 香港自动
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 1200
    proxies:
      - 香港住宅IP
      - 香港节点

  # ---------- 手动切换（对应 QX static 组内 proxy 选项：手动指定单个节点） ----------
  - name: 手动切换
    type: select
    use: [良心云]

  # ---------- 兜底分流：未命中规则的外网流量最终出口（默认香港自动，顺序：香港→台湾→韩国→日本） ----------
  - name: 兜底分流
    type: select
    proxies:
      - 香港自动
      - 台湾节点
      - 韩国节点
      - 日本节点

  # ---------- AI：每个服务独立策略组（手动选地区，规避 IP 跳变风控） ----------
  - name: OpenAI
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Gemini
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Claude
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点
  - name: Grok
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 英国节点
      - 韩国节点
      - 台湾节点

  # ---------- Telegram：默认香港节点（直挂测速组，绕开空住宅链路；消息长连接稳定优先，可手动钉节点） ----------
  # TG App 直连 DC IP 不查 DNS，此前无规则匹配、一直掉兜底；专属组后出口固定、可手动钉节点
  - name: Telegram
    type: select
    proxies:
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点
      - 美国节点

  # ---------- X：默认香港自动（住宅优先，无住宅回退香港节点，可手动切其他地区） ----------
  - name: X
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Binance 币安：默认香港自动（2026-09-06 实测主域直连已全被墙，见 CHANGELOG），可手动切 DIRECT/其他地区 ----------
  - name: Binance
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - DIRECT
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- OKX 欧易：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
  - name: OKX
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Bybit：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
  - name: Bybit
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Bitget：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
  - name: Bitget
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Gate：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
  - name: Gate
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- TradingView：默认香港自动（住宅/香港节点自动选可用，可手动切地区） ----------
  - name: TradingView
    type: select
    proxies:
      - 香港自动
      - 香港住宅IP
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 韩国节点

  # ---------- Cornix：默认香港节点，可手动切其他地区（后端在欧美，晚高峰港节点差时可钉日/新节点） ----------
  - name: Cornix
    type: select
    proxies:
      - 香港节点
      - 新加坡节点
      - 日本节点
      - 台湾节点
      - 韩国节点
      - 美国节点

  # ---------- Fomo：默认 DIRECT 直连，可手动切换地区节点 ----------
  # 节点备选顺序不代表 Fomo 官方风控评级；不得用于规避地区限制
  - name: Fomo
    type: select
    proxies:
      - DIRECT
      - 香港自动
      - 新加坡节点
      - 日本节点
      - 台湾节点
      - 韩国节点
      - 英国节点
      - 美国节点

  # ---------- 国际流媒体：默认香港节点，手动备选按风控严重性排序（最严重排最后） ----------
  # 排序依据：美区(Netflix/Disney+/Hulu风控最严) > 英国(BBC iPlayer) > 日本(AbemaTV/DMM) > 韩国 > 新加坡 > 台湾
  - name: InternationalStreaming
    type: select
    proxies:
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 韩国节点
      - 日本节点
      - 英国节点
      - 美国节点

