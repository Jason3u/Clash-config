# ============================================================
#  分流规则（顺序与 QX [filter_remote] + [filter_local] 完全一致）
#  X/交易所/Cornix/Fomo/国际流媒体 通过 Proxy-Rules-Collection 的 Clash YAML 规则集远程引用
# ============================================================
rules:
  # ---------- Apple 核心 → 直连 ----------
  - RULE-SET,Apple,DIRECT
  - RULE-SET,iCloud,DIRECT
  - RULE-SET,AppStore,DIRECT
  - RULE-SET,AppleMusic,DIRECT
  # ---------- Apple 外区：AppleNews → 兜底分流，AppleTV → 国际流媒体 ----------
  - RULE-SET,AppleNews,兜底分流
  - RULE-SET,AppleTV,InternationalStreaming
  # ---------- AI → 各自策略组 ----------
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Gemini,Gemini
  - RULE-SET,Anthropic,Claude
  - RULE-SET,Claude,Claude
  # ---------- 自建规则 → 对应策略组 ----------
  - RULE-SET,Telegram,Telegram
  - RULE-SET,X,X
  - RULE-SET,Binance,Binance
  - RULE-SET,OKX,OKX
  - RULE-SET,Bybit,Bybit
  - RULE-SET,Bitget,Bitget
  - RULE-SET,Gate,Gate
  - RULE-SET,TradingView,TradingView
  - RULE-SET,Cornix,Cornix
  - RULE-SET,Fomo,Fomo
  - RULE-SET,InternationalStreaming,InternationalStreaming
  # ---------- 内网直连 ----------
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/24,DIRECT,no-resolve
  # ---------- Grok（xAI） ----------
  - DOMAIN-SUFFIX,grok.com,Grok
  - DOMAIN-SUFFIX,x.ai,Grok
  # ---------- 国内直连 + 兜底 ----------
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流
